<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Café Crave | Halaal Café &amp; Vinyl Music Hub | Claremont</title>
    <meta name="description" content="A retro, music-inspired halaal café in Cape Town. Artisan coffee, all-day meals, vinyl records and board games — visit us in Claremont." />
    <link rel="canonical" href="https://cafecravecpt.co.za/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Café Crave | Halaal Café &amp; Vinyl Music Hub | Claremont" />
    <meta property="og:description" content="A retro, music-inspired halaal café in Cape Town. Artisan coffee, all-day meals, vinyl records and board games — visit us in Claremont." />
    <meta property="og:url" content="https://cafecravecpt.co.za/" />
    <meta property="og:image" content="https://cafecravecpt.co.za/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Café Crave | Halaal Café &amp; Vinyl Music Hub | Claremont" />
    <meta name="twitter:description" content="A retro, music-inspired halaal café in Cape Town. Artisan coffee, all-day meals, vinyl records and board games — visit us in Claremont." />
    <meta name="twitter:image" content="https://cafecravecpt.co.za/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Load feel: an HTML-level preconnect + link starts the font request
         as soon as the preload scanner sees this document, instead of only
         after index.css has been fetched and parsed (a CSS @import can't be
         discovered until then). font-display: swap is already set in the
         Google Fonts URL, so this only affects request timing, not fallback
         behaviour. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
